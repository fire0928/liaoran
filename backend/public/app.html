<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>了然 - AI心理认知与自我疗愈</title>
<style>
/* ========== 设计令牌 ========== */
:root {
  --color-primary: #E8835A; --color-primary-hover: #D4724B; --color-primary-light: #FFF5F0; --color-primary-soft: #F5B090;
  --color-primary-gradient: linear-gradient(135deg, #E8835A, #F09970);
  --color-secondary: #5BC4B0; --color-secondary-hover: #4AB39F; --color-secondary-light: #EDFBF8;
  --color-bg: #F5F0EA; --color-surface: #FFFFFF; --color-surface-warm: #FEF9F5;
  --color-border: #DDD6CE; --color-border-light: #EDE7DF;
  --color-text-primary: #1A1816; --color-text-secondary: #5C564E; --color-text-tertiary: #8E857A; --color-text-inverse: #FFF;
  --color-success: #2DB090; --color-success-bg: #E5F8F2;
  --color-warning: #E5A020; --color-warning-bg: #FFF8E5;
  --color-danger: #E04545; --color-danger-bg: #FDEAEA;
  --color-info: #4A80D0; --color-info-bg: #EBF0FA;
  --color-crisis: #D06A10; --color-crisis-bg: #FFF3E3; --color-crisis-text: #7A3A00;
  --color-chat-user-bg: #FFF0EB; --color-chat-ai-bg: #FFF; --color-chat-input-bg: #FEF9F5;
  --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 20px; --space-xl: 24px; --space-2xl: 32px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-full: 9999px;
  --shadow-subtle: 0 2px 4px rgba(0,0,0,.06); --shadow-raised: 0 4px 12px rgba(0,0,0,.1); --shadow-floating: 0 8px 24px rgba(0,0,0,.12);
  --font-heading: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:var(--font-body); background:var(--color-bg); color:var(--color-text-primary);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ========== 登录页 ========== */
.login-page {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--color-bg); padding:var(--space-xl);
}
.login-card {
  background:var(--color-surface); border-radius:var(--radius-xl); padding:var(--space-3xl) var(--space-2xl);
  width:100%; max-width:360px; box-shadow:var(--shadow-floating); text-align:center;
}
.login-logo {
  width:64px; height:64px; border-radius:var(--radius-lg); background:var(--color-primary-gradient);
  display:flex; align-items:center; justify-content:center; color:#fff;
  font-size:30px; font-weight:700; margin:0 auto var(--space-lg); box-shadow:0 4px 20px rgba(232,131,90,.3);
}
.login-title { font-size:22px; font-weight:700; margin-bottom:4px; }
.login-sub { font-size:13px; color:var(--color-text-tertiary); margin-bottom:var(--space-xl); }
.login-error { background:var(--color-danger-bg); color:var(--color-danger); font-size:13px; padding:var(--space-sm); border-radius:var(--radius-sm); margin-bottom:var(--space-md); display:none; }
.form-group { margin-bottom:var(--space-md); }
.form-label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--color-text-secondary); }
.form-input {
  width:100%; height:44px; border:1px solid var(--color-border); border-radius:var(--radius-md);
  padding:0 var(--space-md); font-size:15px; font-family:var(--font-body); background:var(--color-surface-warm);
  color:var(--color-text-primary); outline:none; transition:border-color .2s;
}
.form-input:focus { border-color:var(--color-primary); }
.btn-code {
  height:44px; padding:0 14px; border:1px solid var(--color-primary);
  border-radius:var(--radius-md); background:#fff; color:var(--color-primary);
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition:all .2s; flex-shrink:0;
}
.btn-code:disabled { border-color:var(--color-border); color:var(--color-text-tertiary); cursor:not-allowed; }
.btn-code:hover:not(:disabled) { background:var(--color-primary-light); }
.form-textarea {
  width:100%; border:1px solid var(--color-border); border-radius:var(--radius-md);
  padding:var(--space-sm); font-size:14px; font-family:var(--font-body); background:var(--color-surface-warm);
  resize:vertical; outline:none; min-height:80px;
}
.form-textarea:focus { border-color:var(--color-primary); }

.btn {
  border:none; border-radius:var(--radius-md); height:44px; padding:0 var(--space-xl);
  font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  transition:all .2s; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--color-primary); color:var(--color-text-inverse); }
.btn-primary:hover { background:var(--color-primary-hover); }
.btn-secondary { background:var(--color-secondary); color:#fff; }
.btn-outline { background:transparent; border:1.5px solid var(--color-primary); color:var(--color-primary); }
.btn-block { width:100%; }
.btn-sm { height:34px; padding:0 var(--space-sm); font-size:13px; border-radius:var(--radius-sm); }
.btn:disabled { opacity:.5; pointer-events:none; }

/* ========== 主壳 ========== */
#mainShell { display:none; max-width:480px; margin:0 auto; min-height:100vh; position:relative; }
.app-content { padding-bottom:64px; }

/* ========== Tab Bar ========== */
.tab-bar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  max-width:480px; width:100%; height:56px; background:var(--color-surface);
  border-top:1px solid var(--color-border-light); display:flex; align-items:center;
  justify-content:space-around; z-index:100;
}
.tab-item {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; padding:4px 8px; background:none; border:none; outline:none;
  -webkit-tap-highlight-color:transparent; transition:all .2s;
}
.tab-item svg { width:24px; height:24px; stroke:var(--color-text-tertiary); fill:none; stroke-width:1.8; }
.tab-item span { font-size:11px; color:var(--color-text-tertiary); font-weight:500; }
.tab-item.active svg { stroke:var(--color-primary); }
.tab-item.active span { color:var(--color-primary); font-weight:600; }
.tab-item:active { transform:scale(.92); }

/* ========== 页面 ========== */
.page { display:none; padding:var(--space-lg) var(--space-md); min-height:calc(100vh - 56px); }
.page.active { display:block; }

/* 卡片 */
.card {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  margin-bottom:var(--space-md); border:1px solid var(--color-border-light);
  box-shadow:var(--shadow-subtle);
}
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-md); }
.card-title { font-size:16px; font-weight:600; }
.card-warm { background:var(--color-surface-warm); }
.card-gradient {
  background:var(--color-primary-gradient); color:#fff; border:none;
  box-shadow:0 4px 20px rgba(232,131,90,.25);
}

/* 标签 */
.tag { font-size:11px; padding:3px 10px; border-radius:var(--radius-full); font-weight:500; display:inline-block; }
.tag-primary { background:var(--color-primary-light); color:var(--color-primary); }
.tag-secondary { background:var(--color-secondary-light); color:var(--color-secondary); }
.tag-success { background:var(--color-success-bg); color:var(--color-success); }
.tag-warning { background:var(--color-warning-bg); color:var(--color-warning); }
.tag-danger { background:var(--color-danger-bg); color:var(--color-danger); }

/* ========== 首页 ========== */
.greeting { padding:var(--space-xl) 0; }
.greeting h1 { font-size:26px; font-weight:700; margin-bottom:4px; }
.greeting p { font-size:14px; color:var(--color-text-secondary); }

.daily-quote {
  background:linear-gradient(135deg, var(--color-primary-light), var(--color-secondary-light));
  border-radius:var(--radius-xl); padding:var(--space-xl); margin-bottom:var(--space-lg);
  position:relative; overflow:hidden;
}
.quote-mark { font-size:48px; color:var(--color-primary); opacity:.3; line-height:1; margin-bottom:-8px; }
.quote-text { font-size:15px; font-weight:600; line-height:1.6; margin-bottom:var(--space-sm); }
.quote-author { font-size:12px; color:var(--color-text-tertiary); }

.feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm); margin-bottom:var(--space-lg); }
.feature-card {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  border:1px solid var(--color-border-light); cursor:pointer; transition:all .2s;
  display:flex; flex-direction:column; gap:var(--space-sm);
}
.feature-card:active { transform:scale(.97); background:var(--color-surface-warm); }
.feature-icon {
  width:40px; height:40px; border-radius:var(--radius-md); display:flex;
  align-items:center; justify-content:center; font-size:20px;
}
.feature-icon.orange { background:var(--color-primary-light); color:var(--color-primary); }
.feature-icon.green { background:var(--color-secondary-light); color:var(--color-secondary); }
.feature-icon.blue { background:var(--color-info-bg); color:var(--color-info); }
.feature-icon.purple { background:#F5F0F9; color:#9B7DC9; }
.feature-name { font-size:14px; font-weight:600; }
.feature-desc { font-size:12px; color:var(--color-text-secondary); line-height:1.5; }

.ad-banner {
  height:70px; border-radius:var(--radius-lg); display:flex; align-items:center;
  padding:0 var(--space-xl); margin-bottom:var(--space-lg); cursor:pointer;
  background:linear-gradient(135deg, #F0E0D6, #E8D5C0); border:1px solid var(--color-border-light);
}
.ad-banner-title { font-size:15px; font-weight:600; }
.ad-banner-sub { font-size:12px; color:var(--color-text-secondary); }

.recommend-list { display:flex; flex-direction:column; gap:var(--space-sm); }
.recommend-item {
  background:var(--color-surface); border-radius:var(--radius-md); padding:var(--space-md);
  display:flex; align-items:center; gap:var(--space-md); border:1px solid var(--color-border-light);
  cursor:pointer;
}
.recommend-item:active { background:var(--color-surface-warm); }
.recommend-icon { width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-light); color:var(--color-primary); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.recommend-info { flex:1; min-width:0; }
.recommend-title { font-size:14px; font-weight:500; }
.recommend-time { font-size:12px; color:var(--color-text-tertiary); }
.recommend-arrow { color:var(--color-text-tertiary); }

/* ========== 测评页 ========== */
.stats-row { display:flex; gap:var(--space-sm); margin-bottom:var(--space-lg); }
.stat-item { flex:1; background:var(--color-surface); border-radius:var(--radius-md); padding:var(--space-md); text-align:center; border:1px solid var(--color-border-light); }
.stat-num { font-size:24px; font-weight:700; color:var(--color-primary); }
.stat-label { font-size:12px; color:var(--color-text-tertiary); margin-top:2px; }

.filter-row { display:flex; gap:var(--space-xs); margin-bottom:var(--space-lg); flex-wrap:wrap; }
.filter-chip {
  padding:6px 16px; border-radius:var(--radius-full); font-size:13px; font-weight:500;
  border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-secondary);
  cursor:pointer; transition:all .2s;
}
.filter-chip.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }

.assess-item {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  margin-bottom:var(--space-sm); border:1px solid var(--color-border-light);
  border-left:4px solid var(--color-primary); cursor:pointer;
}
.assess-item:active { background:var(--color-surface-warm); }
.assess-item-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.assess-item-name { font-size:15px; font-weight:600; }
.assess-item-score { font-size:22px; font-weight:700; font-family:monospace; }
.assess-item-meta { font-size:12px; color:var(--color-text-tertiary); }

/* ========== 探索页 ========== */
.explore-categories { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm); }
.explore-cat {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  text-align:center; border:1px solid var(--color-border-light); cursor:pointer; transition:all .2s;
}
.explore-cat:active { transform:scale(.97); }
.explore-cat-emoji { font-size:28px; margin-bottom:var(--space-xs); }
.explore-cat-name { font-size:14px; font-weight:600; }
.explore-cat-count { font-size:11px; color:var(--color-text-tertiary); }

/* ========== 对话页 ========== */
.agent-list { display:flex; flex-direction:column; gap:var(--space-sm); }
.agent-card {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  display:flex; align-items:center; gap:var(--space-md); border:1px solid var(--color-border-light);
  cursor:pointer; transition:all .2s;
}
.agent-card:active { background:var(--color-surface-warm); }
.agent-avatar {
  width:44px; height:44px; border-radius:var(--radius-md); display:flex;
  align-items:center; justify-content:center; color:#fff; font-size:18px; font-weight:700; flex-shrink:0;
}
.agent-info { flex:1; min-width:0; }
.agent-name { font-size:15px; font-weight:600; }
.agent-desc { font-size:12px; color:var(--color-text-secondary); margin-top:2px; }
.agent-status { font-size:11px; color:var(--color-success); margin-top:2px; }

/* ========== 树洞页 ========== */
.treehole-header {
  text-align:center; padding:var(--space-xl) 0;
  background:linear-gradient(135deg, #EDF7F4, #F7F4F0); border-radius:var(--radius-xl); margin-bottom:var(--space-lg);
}
.treehole-header h2 { font-size:22px; font-weight:700; margin-bottom:4px; }
.treehole-header p { font-size:13px; color:var(--color-text-secondary); }

.post-composer {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  margin-bottom:var(--space-lg); border:1px solid var(--color-border-light);
}
.post-input {
  width:100%; min-height:80px; border:none; outline:none; font-size:14px;
  font-family:var(--font-body); background:transparent; resize:none; line-height:1.6;
}
.post-input::placeholder { color:var(--color-text-tertiary); }
.post-footer { display:flex; align-items:center; justify-content:space-between; padding-top:var(--space-md); border-top:1px solid var(--color-border-light); margin-top:var(--space-md); }
.post-moods { display:flex; gap:6px; }
.mood-chip { font-size:11px; padding:4px 10px; border-radius:var(--radius-full); background:var(--color-surface-warm); cursor:pointer; border:1px solid transparent; }
.mood-chip.selected { background:var(--color-primary-light); color:var(--color-primary); border-color:var(--color-primary-soft); }

.post-card {
  background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg);
  margin-bottom:var(--space-sm); border:1px solid var(--color-border-light);
}
.post-header { display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-sm); }
.post-avatar { width:32px; height:32px; border-radius:50%; background:var(--color-surface-warm); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--color-text-tertiary); }
.post-author { font-size:13px; font-weight:500; }
.post-time { font-size:11px; color:var(--color-text-tertiary); margin-left:auto; }
.post-body { font-size:14px; line-height:1.7; margin-bottom:var(--space-sm); }
.post-tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:var(--space-sm); }
.post-actions { display:flex; gap:var(--space-xl); padding-top:var(--space-sm); border-top:1px solid var(--color-border-light); }
.post-act { font-size:12px; color:var(--color-text-tertiary); cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:4px; }

/* ========== 我的 ========== */
.profile-hero {
  background:linear-gradient(135deg, var(--color-primary-light), var(--color-bg));
  border-radius:var(--radius-xl); padding:var(--space-2xl) var(--space-xl); text-align:center;
  margin-bottom:var(--space-lg);
}
.profile-avatar {
  width:72px; height:72px; border-radius:50%; margin:0 auto var(--space-md);
  background:var(--color-primary-gradient); display:flex; align-items:center;
  justify-content:center; font-size:28px; font-weight:700; color:#fff;
}
.profile-name { font-size:20px; font-weight:700; margin-bottom:2px; }
.profile-id { font-size:12px; color:var(--color-text-tertiary); margin-bottom:var(--space-md); }
.profile-stats { display:flex; justify-content:center; gap:var(--space-2xl); }
.profile-stat { text-align:center; }
.profile-stat-num { font-size:20px; font-weight:700; }
.profile-stat-label { font-size:11px; color:var(--color-text-tertiary); }

.menu-list { background:var(--color-surface); border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--color-border-light); margin-bottom:var(--space-lg); }
.menu-item {
  display:flex; align-items:center; justify-content:space-between; padding:var(--space-md) var(--space-lg);
  border-bottom:1px solid var(--color-border-light); cursor:pointer; font-size:14px;
}
.menu-item:last-child { border-bottom:none; }
.menu-item:active { background:var(--color-surface-warm); }
.menu-item-left { display:flex; align-items:center; gap:var(--space-md); }
.menu-item-icon { font-size:18px; }
.menu-item-arrow { color:var(--color-text-tertiary); }

.mood-bar { background:var(--color-surface); border-radius:var(--radius-lg); padding:var(--space-lg); margin-bottom:var(--space-lg); border:1px solid var(--color-border-light); }
.mood-bar-title { font-size:15px; font-weight:600; margin-bottom:var(--space-md); }
.mood-options { display:flex; justify-content:space-between; }
.mood-opt { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:6px; border-radius:var(--radius-md); border:2px solid transparent; }
.mood-opt.selected { background:var(--color-primary-light); border-color:var(--color-primary); }
.mood-opt-emoji { font-size:26px; }
.mood-opt-label { font-size:11px; color:var(--color-text-secondary); }
.mood-opt.selected .mood-opt-label { color:var(--color-primary); }

/* ========== Overlay ========== */
.overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:200;
  background:var(--color-bg); display:none; overflow-y:auto;
}
.overlay.active { display:block; }
.overlay-header {
  height:50px; display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--space-md); background:var(--color-surface); border-bottom:1px solid var(--color-border-light);
  position:sticky; top:0; z-index:10;
}
.overlay-close { background:none; border:none; font-size:22px; cursor:pointer; padding:8px; color:var(--color-text-secondary); }
.overlay-title { font-size:16px; font-weight:600; }
.overlay-body { padding:var(--space-lg) var(--space-md); }

/* 对话 overlay */
.chat-messages { padding:var(--space-md); display:flex; flex-direction:column; gap:var(--space-md); min-height:60vh; }
.msg-row { display:flex; gap:var(--space-sm); max-width:85%; }
.msg-row.user { align-self:flex-end; flex-direction:row-reverse; }
.msg-avatar {
  width:32px; height:32px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:12px; font-weight:600; color:#fff; flex-shrink:0;
}
.msg-bubble { padding:var(--space-sm) var(--space-md); border-radius:16px; font-size:14px; line-height:1.6; }
.msg-row.ai .msg-bubble { background:var(--color-chat-ai-bg); border:1px solid var(--color-border-light); border-radius:16px 16px 16px 4px; }
.msg-row.user .msg-bubble { background:var(--color-chat-user-bg); border-radius:16px 16px 4px 16px; color:var(--color-chat-user-text,#1A1816); }
.msg-time { font-size:10px; color:var(--color-text-tertiary); margin-top:2px; padding:0 4px; }

.chat-input-bar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); max-width:480px; width:100%;
  padding:var(--space-sm) var(--space-md); background:var(--color-surface);
  border-top:1px solid var(--color-border-light); display:flex; gap:var(--space-sm); align-items:flex-end;
}
.chat-input {
  flex:1; padding:10px 16px; border:1px solid var(--color-border); border-radius:20px;
  font-size:14px; resize:none; outline:none; background:var(--color-chat-input-bg);
  font-family:var(--font-body); min-height:40px; max-height:100px; line-height:1.5;
}
.chat-input:focus { border-color:var(--color-primary); }

/* 测评执行 overlay */
.question-progress { height:4px; background:var(--color-border-light); border-radius:2px; margin-bottom:var(--space-xl); }
.question-progress-fill { height:100%; background:var(--color-primary); border-radius:2px; transition:width .3s; }
.question-counter { text-align:center; font-size:13px; color:var(--color-text-tertiary); margin-bottom:var(--space-xl); }
.question-text { font-size:18px; font-weight:600; line-height:1.6; margin-bottom:var(--space-2xl); text-align:center; }
.option-list { display:flex; flex-direction:column; gap:var(--space-sm); }
.option-btn {
  padding:var(--space-md) var(--space-lg); border:2px solid var(--color-border); border-radius:var(--radius-lg);
  background:var(--color-surface); font-size:15px; cursor:pointer; transition:all .2s;
  text-align:center; font-family:var(--font-body);
}
.option-btn.selected { border-color:var(--color-primary); background:var(--color-primary-light); color:var(--color-primary); font-weight:600; }

/* 报告 overlay */
.score-ring { position:relative; width:120px; height:120px; margin:0 auto var(--space-xl); }
.score-ring svg { transform:rotate(-90deg); }
.score-ring-text {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  text-align:center;
}
.score-ring-num { font-size:36px; font-weight:700; line-height:1; }
.score-ring-label { font-size:12px; color:var(--color-text-tertiary); }
.level-badge { text-align:center; margin-bottom:var(--space-xl); }

.dim-item { display:flex; align-items:center; gap:var(--space-md); }
.dim-name { width:60px; font-size:13px; font-weight:500; }
.dim-bar { flex:1; height:8px; background:var(--color-border-light); border-radius:4px; overflow:hidden; }
.dim-bar-fill { height:100%; border-radius:4px; transition:width .6s; }
.dim-score { width:40px; text-align:right; font-size:13px; font-weight:600; }

.ai-interpret { background:var(--color-secondary-light); border-radius:var(--radius-lg); padding:var(--space-lg); margin-bottom:var(--space-lg); }
.ai-interpret-title { font-size:14px; font-weight:600; color:var(--color-secondary); margin-bottom:var(--space-sm); }
.ai-interpret-text { font-size:13px; line-height:1.7; color:var(--color-text-secondary); }

/* Toast */
.toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75); color:#fff; padding:var(--space-sm) var(--space-xl);
  border-radius:var(--radius-full); font-size:14px; z-index:9999; opacity:0;
  transition:opacity .3s; pointer-events:none;
}
.toast.show { opacity:1; }

/* 娱乐弹窗 */
.entertain-result { text-align:center; padding:var(--space-2xl) 0; }
.entertain-emoji { font-size:48px; margin-bottom:var(--space-md); }

.entertain-desc { font-size:14px; color:var(--color-text-secondary); line-height:1.6; }

.entertain-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--color-border-light); font-size:13px; }
.entertain-row:last-child { border-bottom:none; }

/* 加载 */
.loading-row { text-align:center; padding:var(--space-2xl); color:var(--color-text-tertiary); font-size:14px; }
.spinner {
  display:inline-block; width:22px; height:22px; border:3px solid var(--color-border-light);
  border-top-color:var(--color-primary); border-radius:50%; animation:spin .7s linear infinite;
  vertical-align:middle; margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* 设置 overlay */

  background:var(--color-surface); border:1px solid var(--color-border-light); margin-bottom:-1px;
}
.setting-row:first-of-type { border-radius:var(--radius-md) var(--radius-md) 0 0; }
.setting-row:last-of-type { border-radius:0 0 var(--radius-md) var(--radius-md); margin-bottom:0; }
.setting-label { font-size:14px; }
.toggle {

}
.toggle.on { background:var(--color-primary); }
.toggle::after {

  background:#fff; border-radius:50%; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.15);
}

</style>

<script>
/* ========== 配置 ========== */
let API_BASE = window.location.origin + '/api/v1';
const AUTH = {
  getToken() { return localStorage.getItem('lr_token'); },
  setToken(t) { localStorage.setItem('lr_token', t); },
  clear() { localStorage.removeItem('lr_token'); localStorage.removeItem('lr_user'); },
  isAuthed() { return !!this.getToken(); },
  getUser() { try { return JSON.parse(localStorage.getItem('lr_user')); } catch(e) { return null; } }
};

/* ========== API ========== */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const token = AUTH.getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { headers, ...opts });
  if (res.status === 401) { AUTH.clear(); showLogin(); throw new Error('登录已过期'); }
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.message || '请求失败');
  return json.data;
}
const GET = (p) => api(p);
const PUT = (p, body) => api(p, { method: 'PUT', body: JSON.stringify(body) });
const POST = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body) });
const DEL = (p) => api(p, { method: 'DELETE' });

/* ========== Toast ========== */
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

/* ========== 登录/注册 ========== */
function showLogin() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('mainShell').style.display = 'none';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn'), errEl = document.getElementById('loginError');
  const phone = document.getElementById('loginPhone').value.trim();
  const pwd = document.getElementById('loginPwd').value.trim();
  errEl.style.display = 'none'; btn.disabled = true; btn.textContent = '登录中...';
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password: pwd })
    });
    const json = await res.json();
    if (json.code !== 0 || !json.data?.token) { errEl.textContent = json.message || '登录失败'; errEl.style.display = 'block'; return; }
    AUTH.setToken(json.data.token);
    // 直接使用登录返回的用户信息
    if (json.data.user) {
      localStorage.setItem('lr_user', JSON.stringify(json.data.user));
    }
    enterApp();
  } catch (err) { errEl.textContent = '网络错误，请检查服务器'; errEl.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = '登 录'; }
}

function doRegister() {
  document.getElementById('registerOverlay').classList.add('active');
  document.getElementById('regError').style.display = 'none';
}
function closeRegister() { document.getElementById('registerOverlay').classList.remove('active'); }

// 注册 - 发送验证码
async function sendRegCode() {
  const phone = document.getElementById('regPhone').value.trim();
  const errEl = document.getElementById('regError');
  const btn = document.getElementById('regSendCodeBtn');
  errEl.style.display = 'none';
  if (!/^1[3-9]\d{9}$/.test(phone)) { errEl.textContent = '请输入正确的手机号'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '发送中...';
  try {
    const res = await fetch(API_BASE + '/auth/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const json = await res.json();
    if (json.code !== 0) { errEl.textContent = json.message || '发送失败'; errEl.style.display = 'block'; return; }
    showToast('验证码已发送');
    let sec = 60;
    btn.textContent = sec + 's 后重发';
    const timer = setInterval(() => {
      sec--;
      if (sec <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
      else { btn.textContent = sec + 's 后重发'; }
    }, 1000);
  } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = '获取验证码'; }
}

async function doRegisterSubmit(e) {
  e.preventDefault();
  const errEl = document.getElementById('regError');
  const phone = document.getElementById('regPhone').value.trim();
  const code = document.getElementById('regCode').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const pwd = document.getElementById('regPwd').value.trim();
  errEl.style.display = 'none';
  try {
    const res = await fetch(API_BASE + '/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password: pwd, nickname, code })
    });
    const json = await res.json();
    if (json.code !== 0) { errEl.textContent = json.message || '注册失败'; errEl.style.display = 'block'; return; }
    showToast('注册成功，请登录');
    closeRegister();
    document.getElementById('loginPhone').value = phone;
    document.getElementById('loginPwd').value = pwd;
  } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
}

/* ========== 忘记密码 ========== */
function showForgotPwd() {
  document.getElementById('forgotPwdOverlay').classList.add('active');
  document.getElementById('fpwdStep1').style.display = 'block';
  document.getElementById('fpwdStep2').style.display = 'none';
  document.getElementById('fpwdError').style.display = 'none';
}
function closeForgotPwd() { document.getElementById('forgotPwdOverlay').classList.remove('active'); }

async function sendForgotPwdCode(e) {
  e.preventDefault();
  const errEl = document.getElementById('fpwdError');
  const phone = document.getElementById('fpwdPhone').value.trim();
  const btn = document.getElementById('fpwdSendBtn');
  errEl.style.display = 'none';
  if (!/^1[3-9]\d{9}$/.test(phone)) { errEl.textContent = '请输入正确的手机号'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '发送中...';
  try {
    const res = await fetch(API_BASE + '/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const json = await res.json();
    if (json.code !== 0) { errEl.textContent = json.message || '发送失败'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = '获取验证码'; return; }
    showToast('验证码已发送');
    document.getElementById('fpwdStep1').style.display = 'none';
    document.getElementById('fpwdStep2').style.display = 'block';
  } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = '获取验证码'; }
}

async function doResetPassword(e) {
  e.preventDefault();
  const errEl = document.getElementById('fpwdError');
  const phone = document.getElementById('fpwdPhone').value.trim();
  const code = document.getElementById('fpwdCode').value.trim();
  const pwd = document.getElementById('fpwdNewPwd').value.trim();
  errEl.style.display = 'none';
  try {
    const res = await fetch(API_BASE + '/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, code, password: pwd })
    });
    const json = await res.json();
    if (json.code !== 0) { errEl.textContent = json.message || '重置失败'; errEl.style.display = 'block'; return; }
    showToast('密码已重置，请登录');
    closeForgotPwd();
    document.getElementById('loginPhone').value = phone;
    document.getElementById('loginPwd').value = '';
  } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
}

function enterApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainShell').style.display = 'block';
  switchTab('home');
}

/* ========== Tab 切换 ========== */
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pg-' + tab).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  loadTabData(tab);
}

function loadTabData(tab) {
  switch(tab) {
    case 'home': loadHome(); break;
    case 'assess': loadAssessments(); break;
    case 'explore': loadExplore(); break;
    case 'chat': loadChatAgents(); break;
    case 'treehole': loadTreehole(); break;
    case 'profile': loadProfile(); break;
  }
}

/* ========== 1. 首页 ========== */
async function loadHome() {
  const el = document.getElementById('homeContent');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span>加载中...</div>';
  try {
    let dash = null;
    try { dash = await GET('/admin/dashboard'); } catch(e) { /* 用户权益接口不可用，用本地数据 */ }
    const u = AUTH.getUser();

let currentAssess = null;
async function startAssessment(scaleId, name) {
  currentAssess = { scaleId, name, questions: [], current: 0, answers: [] };
  const overlay = document.getElementById('assessExecOverlay');
  overlay.classList.add('active');
  document.getElementById('assessExecBody').innerHTML = '<div class="loading-row"><span class="spinner"></span>加载题目...</div>';
  try {

}

function getSampleQuestions() {
  return [

    { id:'q8', question_text:'我的睡眠质量不好', options:['完全不符合','比较不符合','一般','比较符合','完全符合'] }
  ];
}

function renderQuestion() {
  const q = currentAssess.questions[currentAssess.current];
  const total = currentAssess.questions.length;
  const pct = ((currentAssess.current + 1) / total * 100);
  document.getElementById('assessExecBody').innerHTML = `
    <div class="question-progress"><div class="question-progress-fill" style="width:${pct}%"></div></div>
    <div class="question-counter">第 ${currentAssess.current + 1} / ${total} 题</div>
    <div class="question-text">${q.question_text}</div>
    <div class="option-list">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})">${opt}</button>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:var(--space-xl)">
      <button class="btn btn-outline btn-block" onclick="prevQuestion()" ${currentAssess.current===0?'disabled':''}>上一题</button>
      <button class="btn btn-primary btn-block" id="nextBtn" onclick="nextQuestion()" disabled>${currentAssess.current >= total-1 ? '完成' : '下一题'}</button>
    </div>
  `;
}

function selectAnswer(idx) {
  currentAssess.answers[currentAssess.current] = idx;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.option-btn')[idx].classList.add('selected');
  document.getElementById('nextBtn').disabled = false;
}

function prevQuestion() {
  if (currentAssess.current > 0) { currentAssess.current--; renderQuestion(); restoreSelection(); }
}
function nextQuestion() {
  if (currentAssess.current < currentAssess.questions.length - 1) {
    currentAssess.current++; renderQuestion(); restoreSelection();
  } else {
    showReport();
  }
}
function restoreSelection() {
  const ans = currentAssess.answers[currentAssess.current];
  if (ans !== undefined) {
    document.querySelectorAll('.option-btn')[ans].classList.add('selected');
    document.getElementById('nextBtn').disabled = false;
  } else {
    document.getElementById('nextBtn').disabled = true;
  }
}

function closeAssessExec() {
  document.getElementById('assessExecOverlay').classList.remove('active');
  currentAssess = null;
}

/* ========== 测评报告 ========== */
async function showReport() {
  document.getElementById('assessExecOverlay').classList.remove('active');
  const overlay = document.getElementById('assessReportOverlay');
  overlay.classList.add('active');

  // 计算分数
  const totalScore = currentAssess.answers.reduce((a,b) => a + b, 0);
  const maxScore = (currentAssess.questions.length - 1) * currentAssess.questions.length;
  const pct = Math.round(totalScore / Math.max(maxScore, 1) * 100);
  let level = '', color = '';
  if (pct < 30) { level = '良好'; color = 'var(--color-success)'; }
  else if (pct < 50) { level = '轻度'; color = 'var(--color-warning)'; }
  else if (pct < 70) { level = '中度'; color = 'var(--color-primary)'; }
  else { level = '重度'; color = 'var(--color-danger)'; }

  document.getElementById('assessReportBody').innerHTML = `
    <div class="score-ring">
      <svg width="120" height="120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--color-border-light)" stroke-width="8"/><circle cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${314*pct/100} 314" stroke-linecap="round"/></svg>
      <div class="score-ring-text"><div class="score-ring-num">${totalScore}</div><div class="score-ring-label">得分</div></div>
    </div>
    <div class="level-badge"><span style="background:${color}20;color:${color}">${level}</span></div>
    <div class="dimension-list">
      <div class="dim-item"><div class="dim-name">焦虑程度</div><div class="dim-bar"><div class="dim-bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="dim-score">${pct}%</div></div>
    </div>
    <div class="ai-interpret">
      <div class="ai-interpret-title">🤖 AI 解读</div>
      <div class="ai-interpret-text" id="aiInterpret">基于你的答题数据，${level === '良好' ? '你的情绪状态目前处于良好水平，请继续保持。' : level === '轻度' ? '你有轻度的情绪波动，建议关注并尝试一些放松方法。' : '你的情绪状态需要关注，建议尝试与AI对话或寻求专业帮助。'}</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="closeAssessReport()">返回</button>
  `;

  // 尝试获取 AI 报告
  try {
    const res = await POST('/admin/ai-report/preview', {
      nickname: AUTH.getUser()?.nickname || '用户',
      scale_name: currentAssess.name,
      total_score: totalScore
    });
    if (res?.report) document.getElementById('aiInterpret').textContent = res.report;
  } catch(e) {}
}

function closeAssessReport() {
  document.getElementById('assessReportOverlay').classList.remove('active');
  currentAssess = null;
  loadAssessments();
}

let currentChatAgent = null;

function startChat(agentId, agentName) {
  currentChatAgent = { id: agentId, name: agentName };
  chatMessages = [{ role:'ai', text:`嗨！我是${agentName}，很高兴见到你 😊 今天想聊些什么呢？`, time:formatTime() }];
  document.getElementById('chatOverlayTitle').textContent = agentName;

  renderChatMessages();
  document.getElementById('chatInput').focus();

function renderChatMessages() {
  const el = document.getElementById('chatMessages');
  el.innerHTML = chatMessages.slice(-20).map(m => `
    <div class="msg-row ${m.role}">
      <div class="msg-avatar" style="background:${m.role==='ai'?'var(--color-primary)':'var(--color-secondary)'}">${m.role==='ai'?currentChatAgent.name[0]:'我'}</div>
      <div><div class="msg-bubble">${escapeHtml(m.text)}</div><div class="msg-time">${m.time}</div></div>
    </div>
  `).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  chatMessages.push({ role:'user', text, time:formatTime() });
  input.value = '';
  renderChatMessages();

  // 模拟 / API AI回复
  try {
    const res = await POST('/ai/chat', {
      agent_id: currentChatAgent.id,
      message: text
    });
    chatMessages.push({ role:'ai', text: res?.reply || '收到你的消息了，让我想想...', time:formatTime() });
  } catch(e) {
    // 本地模拟回复
    const replies = [
      '我听到你说的了，这种感觉确实不容易。可以多跟我说说吗？',
      '谢谢你愿意跟我分享这些。你平时有做过什么来让自己感觉好一些吗？',

      '听起来这对你来说很重要。如果你愿意的话，我们可以更深入地聊聊这个话题。'
    ];
    chatMessages.push({ role:'ai', text: replies[Math.floor(Math.random()*replies.length)], time:formatTime() });
  }
  renderChatMessages();
}

        ${p.mood ? `<div class="post-tags"><span class="tag tag-primary">${p.mood}</span></div>` : ''}
        <div class="post-actions">
          <button class="post-act">❤️ 23</button>
          <button class="post-act">💬 回应</button>
          <button class="post-act">🤗 拥抱</button>
        </div>
      </div>
    `).join('') || '<div class="loading-row">暂无树洞内容</div>'}
  `;
}

function selectMood(el) {
  el.classList.toggle('selected');
}

async function submitPost() {
  const content = document.getElementById('postContent')?.value.trim();
  if (!content) { showToast('请输入内容'); return; }
  try {
    await POST('/treehole', { content, is_anonymous: true });
    showToast('发布成功');
    loadTreehole();
  } catch(e) { showToast('发布失败: ' + e.message); }
}

/* ========== 6. 我的 ========== */
async function loadProfile() {
  const el = document.getElementById('profileContent');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span>加载中...</div>';
  const u = AUTH.getUser();
  try {
    const profile = await GET('/auth/me');
    localStorage.setItem('lr_user', JSON.stringify(profile));
    renderProfile(profile);
  } catch(e) { renderProfile(u || { nickname:'用户', phone:'' }); }
}

function renderProfile(u) {
  document.getElementById('profileContent').innerHTML = `
    <div class="profile-hero">
      <div class="profile-avatar">${(u.nickname||'用')[0]}</div>
      <div class="profile-name">${u.nickname||'未设置'}</div>
      <div class="profile-id">ID: ${u.phone ? u.phone.slice(0,3)+'****'+u.phone.slice(-3) : '****'}</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-num">3</div><div class="profile-stat-label">测评</div></div>
        <div class="profile-stat"><div class="profile-stat-num">12</div><div class="profile-stat-label">对话</div></div>
        <div class="profile-stat"><div class="profile-stat-num">7天</div><div class="profile-stat-label">连续打卡</div></div>
      </div>
    </div>
    <div class="mood-bar">
      <div class="mood-bar-title">今日心情</div>
      <div class="mood-options" id="profileMoods">
        <div class="mood-opt" onclick="selectProfileMood(this)"><span class="mood-opt-emoji">😊</span><span class="mood-opt-label">很不错</span></div>
        <div class="mood-opt selected" onclick="selectProfileMood(this)"><span class="mood-opt-emoji">🙂</span><span class="mood-opt-label">还可以</span></div>
        <div class="mood-opt" onclick="selectProfileMood(this)"><span class="mood-opt-emoji">😐</span><span class="mood-opt-label">一般般</span></div>
        <div class="mood-opt" onclick="selectProfileMood(this)"><span class="mood-opt-emoji">😔</span><span class="mood-opt-label">有点低落</span></div>
        <div class="mood-opt" onclick="selectProfileMood(this)"><span class="mood-opt-emoji">😰</span><span class="mood-opt-label">不太好</span></div>
      </div>
    </div>
    <div class="menu-list">
      <div class="menu-item" onclick="switchTab('assess')"><div class="menu-item-left"><span class="menu-item-icon">📋</span>测评历史</div><span class="menu-item-arrow">→</span></div>
      <div class="menu-item" onclick="switchTab('assess')"><div class="menu-item-left"><span class="menu-item-icon">📊</span>我的报告</div><span class="menu-item-arrow">→</span></div>
      <div class="menu-item" onclick="showSettings()"><div class="menu-item-left"><span class="menu-item-icon">⚙️</span>设置</div><span class="menu-item-arrow">→</span></div>
      <div class="menu-item" onclick="logout()"><div class="menu-item-left"><span class="menu-item-icon">🚪</span>退出登录</div><span class="menu-item-arrow" style="color:var(--color-danger)">→</span></div>
    </div>
  `;
}

function selectProfileMood(el) {
  document.querySelectorAll('#profileMoods .mood-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

/* ========== 7. 设置 ========== */
function showSettings() {
  document.getElementById('settingsOverlay').classList.add('active');
  document.getElementById('settingsBody').innerHTML = `
    <div class="settings-section">
      <div class="settings-section-title">主题</div>
      ${[['默认','#C85A3D'],['暖橙','#E8835A'],['薰衣草','#9580F5'],['深海','#4A80F0'],['橘子海','#E67E30']].map(([name,color]) => `
        <div class="setting-row" onclick="setThemeColor('${color}')">
          <span class="setting-label" style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${color}"></span>${name}</span>
        </div>
      `).join('')}
    </div>
    <div class="settings-section">
      <div class="settings-section-title">功能</div>
      <div class="setting-row"><span class="setting-label">推送通知</span><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
      <div class="setting-row"><span class="setting-label">隐私模式</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">关于</div>
      <div class="setting-row"><span class="setting-label">版本号</span><span style="color:var(--color-text-tertiary);font-size:12px">v1.0.0</span></div>
    </div>
  `;
}

function setThemeColor(color) {
  document.documentElement.style.setProperty('--color-primary', color);
  showToast('主题已切换');
}

function closeSettings() { document.getElementById('settingsOverlay').classList.remove('active'); }

/* ========== 8. 娱乐弹窗 ========== */

    '塔罗占卜': { emoji:'🃏', title:'今日塔罗指引', desc:'你抽到的牌是"隐士"正位，暗示着这是一个需要向内探索的时期。暂时放慢脚步，聆听内心的声音。', detail:[['关键词','内省、智慧、独处'],['建议','给自己一些安静的时间'],['警示','不要过度孤立自己']] },
    '生肖八字': { emoji:'🐉', title:'今日命理解读', desc:'今日五行流通顺畅，适宜与人交流合作。财运方面宜守不宜攻，健康方面注意肠胃保养。', detail:[['吉时','上午9-11时'],['宜','合作、学习、出行'],['忌','冲动消费、争吵']] }
  };
  const r = results[name] || { emoji:'🎯', title:name, desc:'点击开始测试，探索未知的自己 🎯', detail:[] };
  document.getElementById('entertainBody').innerHTML = `
    <div class="entertain-result">
      <div class="entertain-emoji">${r.emoji}</div>
      <div class="entertain-title">${r.title}</div>
      <div class="entertain-desc">${r.desc}</div>
      ${r.detail.length ? `<div class="entertain-detail">${r.detail.map(([k,v]) => `<div class="entertain-row"><span>${k}</span><span style="font-weight:600">${v}</span></div>`).join('')}</div>` : ''}
    </div>
    <button class="btn btn-primary btn-block" onclick="closeEntertain()">关闭</button>
  `;
}
function closeEntertain() { document.getElementById('entertainOverlay').classList.remove('active'); }

/* ========== 退出 ========== */
function logout() {
  AUTH.clear();
  document.getElementById('mainShell').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

/* ========== 工具 ========== */
function formatTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== 键盘回车发送 ========== */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey && document.getElementById('chatOverlay').classList.contains('active')) {
    e.preventDefault(); sendChatMessage();
  }
});
